[package]
name = "rust_lib_kurako"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
walkdir = "2"
regex = "1"
anitomy = { git = "https://github.com/Rapptz/anitomy-rs", branch = "master" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "cookies", "form"] }
reqwest_dav = { version = "=0.3.3", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
futures = "0.3"
once_cell = "1"
simplet2s = "0.2"
# Pure-Rust SMB2/3 client (no C deps) for network-share libraries.
smb2 = "0.35"
chardetng = "1.0"
encoding_rs = "0.8"
unicode-normalization = "0.1"
blake3 = "1"
if-addrs = "0.15"
quick-xml = "0.42"
percent-encoding = "2"
serde-xml-rs = "0.6"
# Anubis proof-of-work on the mirror login route (its "fast" challenge is a
# plain sha256 PoW solved per the public protocol; no browser involved).
sha2 = "0.10"
# Already in the lockfile via rustls; used for unpredictable loopback tokens.
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation-sys = "0.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
