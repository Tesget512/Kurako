[package]
name = "rust_lib_kurako"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
regex = "1"
anitomy = { git = "https://github.com/Rapptz/anitomy-rs", branch = "master" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
futures = "0.3"
once_cell = "1"
simplet2s = "0.2"
# Pure-Rust SMB2/3 client (no C deps) for network-share libraries.
smb2 = "0.13"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
