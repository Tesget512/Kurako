org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=7890 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7890
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Local HTTP proxy so Gradle + media_kit's GitHub .jar downloads work behind
# China's DNS pollution. Machine-specific — adjust the port to your proxy.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
# Disable Kotlin incremental compilation: the project (D:) and pub-cache (C:)
# live on different drives, and the incremental compiler can't build relative
# paths across Windows drive roots ("this and base files have different roots").
kotlin.incremental=false
