org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Keep network proxy settings out of the project. A fixed localhost port breaks
# builds on other machines and should instead live in ~/.gradle/gradle.properties
# or be supplied by the local environment when a proxy is needed.
# Disable Kotlin incremental compilation: the project (D:) and pub-cache (C:)
# live on different drives, and the incremental compiler can't build relative
# paths across Windows drive roots ("this and base files have different roots").
kotlin.incremental=false
